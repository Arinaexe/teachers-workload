<meta charset="utf-8">
<title>Дашборд</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%B1</text></svg>">
<link rel="stylesheet" href="style.css">

<svg width="0" height="0" style="position:absolute">
  <symbol id="icon-cat" viewBox="0 0 100 100">
    <path d="M24 36 Q20 12 40 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 36 Q80 12 60 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="58" r="30" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M36 54 Q40 50 44 54" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M56 54 Q60 50 64 54" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="33" cy="63" r="3.5" fill="currentColor" opacity="0.6"/>
    <circle cx="67" cy="63" r="3.5" fill="currentColor" opacity="0.6"/>
    <path d="M47 62 Q50 65 53 62" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 65 Q46 70 41 67 M50 65 Q54 70 59 67" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M14 58 L32 60 M14 66 L32 64 M86 58 L68 60 M86 66 L68 64" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-duck" viewBox="0 0 100 100">
    <circle cx="58" cy="62" r="27" fill="none" stroke="currentColor" stroke-width="3.2"/>
    <circle cx="35" cy="37" r="15" fill="none" stroke="currentColor" stroke-width="3.2"/>
    <path d="M21 37 Q9 35 11 43 Q13 47 23 43" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="33" cy="33" r="2.5" fill="currentColor"/>
    <path d="M53 57 Q59 51 53 45 Q48 51 53 57" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-cursor" id="blob-cursor"></div>
</div>

<div class="wrap">

  <section id="login-screen">
    <svg class="login-mascot" viewBox="0 0 100 100"><use href="#icon-cat"/></svg>
    <h1>Дашборд</h1>
    <div class="sub">Войдите, чтобы отметить занятия</div>
    <div class="panel" style="position: relative;">
      <div class="sticker">grammar nazi &amp; proud</div>
      <form id="login-form">
        <label>Имя</label>
        <input id="login-name" type="text" autocomplete="username" required>
        <label>PIN</label>
        <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button type="submit">Войти</button>
        <div class="error" id="login-error"></div>
      </form>
    </div>
  </section>

  <section id="app-screen" class="hidden">
    <div class="masthead">
      <svg class="mark" viewBox="0 0 100 100"><use href="#icon-cat"/></svg>
      <div>
        <h1>Дашборд</h1>
        <div class="tag">english department · нагрузка учителей</div>
      </div>
      <div class="masthead-right">
        <span class="who">Вы — <b id="who-name"></b></span>
        <button class="secondary" id="logout-btn">Выйти</button>
      </div>
    </div>

    <div id="teacher-view" class="hidden">
      <h2>Добавить занятие</h2>
      <div class="panel">
        <form id="add-lesson-form" class="add-lesson-form">
          <div>
            <label>Ученик</label>
            <input id="add-student" type="text" required>
          </div>
          <div>
            <label>Дата</label>
            <input id="add-date" type="date" required>
          </div>
          <div>
            <label>Время</label>
            <input id="add-time" type="time">
          </div>
          <button type="submit">Добавить</button>
        </form>
        <div class="error" id="add-lesson-error"></div>
      </div>

      <h2>Ваши занятия</h2>
      <div id="lessons-list" class="loading">Загрузка…</div>
    </div>

    <div id="admin-view" class="hidden">
      <h2>Нагрузка по учителям</h2>
      <div id="admin-stats" class="stat-grid hidden"></div>
      <div class="panel" style="position: relative; overflow: hidden;">
        <svg class="corner-duck" viewBox="0 0 100 100"><use href="#icon-duck"/></svg>
        <div class="table-scroll">
          <div id="summary-table" class="loading">Загрузка…</div>
        </div>
      </div>
      <h2>Все занятия</h2>
      <div class="panel">
        <div class="toolbar" id="admin-filters"></div>
        <div id="all-lessons" class="loading">Загрузка…</div>
      </div>
    </div>

    <footer class="note">teach &amp; shine ✨</footer>
  </section>

</div>

<script src="app.js"></script>
<script>
  (function () {
    var cursorBlob = document.getElementById('blob-cursor');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canHover = window.matchMedia('(pointer: fine)').matches;
    if (!cursorBlob || reduceMotion || !canHover) return;

    var HALF = 120; /* половина размера .blob-cursor (240px) */
    var targetX = window.innerWidth / 2, targetY = window.innerHeight / 2;
    var x = targetX, y = targetY;

    window.addEventListener('mousemove', function (e) {
      targetX = e.clientX;
      targetY = e.clientY;
    });

    function tick() {
      x += (targetX - x) * 0.07;
      y += (targetY - y) * 0.07;
      cursorBlob.style.transform = 'translate3d(' + (x - HALF) + 'px,' + (y - HALF) + 'px,0)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
